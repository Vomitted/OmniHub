# Cloudflare Pages configuration.
#
# There is no build step: docs/ is hand-written static HTML with no dependencies, so Pages
# uploads it as-is. That is also the directory GitHub Pages serves from this repository, so one
# source backs both hosts and neither can drift from the other.
#
# Deploy with:
#     npx wrangler pages deploy
#
# The first run opens a browser to authorise a Cloudflare account. That step cannot be done on
# your behalf, and is deliberately not scripted here.
#
# The project is named omnihubapp rather than omnihub because a Pages subdomain is the project
# name, and omnihub.pages.dev belongs to someone else's project. Cloudflare therefore appended a
# disambiguating suffix and the address read as omnihub-8bb.pages.dev. Pages cannot rename a
# project, so the only way to change the address was a second one. The original project has since
# been deleted and that address no longer resolves, which is worth knowing if you find it written
# down somewhere: it is not down, it is gone.

name = "omnihubapp"
pages_build_output_dir = "docs"
compatibility_date = "2026-09-07"
